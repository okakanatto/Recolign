[package]
name = "cdr-harness"
description = "Recolign: G1 verification viewer served on 127.0.0.1 (development only, not the product shell)"
edition.workspace = true
publish.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "cdr-harness"
path = "src/main.rs"

[dependencies]
ahash = "0.8.12"
cdr-engine = { path = "../engine" }
cdr-service = { path = "../service" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
