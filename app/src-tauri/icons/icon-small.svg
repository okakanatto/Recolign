<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Recolign at 16 to 40 pixels: the same marks on a pixel grid, without the links between them. -->
  <defs>
    <linearGradient id="plate" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#22C1C3"/>
      <stop offset="0.5" stop-color="#2F6BEA"/>
      <stop offset="1" stop-color="#3B2FB0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD36E"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#plate)"/>
  <g fill="#FFFFFF">
    <rect x="4" y="6" width="10" height="4" rx="2"/>
    <rect x="6" y="14" width="8" height="4" rx="2"/>
    <rect x="5" y="22" width="9" height="4" rx="2" fill-opacity="0.8"/>
    <rect x="18" y="6" width="10" height="4" rx="2"/>
    <rect x="18" y="22" width="7" height="4" rx="2" fill-opacity="0.8"/>
  </g>
  <rect x="18" y="14" width="11" height="4" rx="2" fill="url(#accent)"/>
</svg>
